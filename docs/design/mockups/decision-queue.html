<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body { margin: 0; } [hidden] { display: none !important; }</style>
<title>maji-mcp Decision Queue</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a three-lane timeline. Behind (history) | Now (the item in front of you) | Ahead (the queue). Narrow screens show one lane at a time. */
:root {
  --bg: #eceff3;
  --panel: #f8f9fb;
  --raised: #ffffff;
  --ink: #17202b;
  --muted: #586374;
  --line: #d2d8e1;
  --accent: #2b4fa8;          /* signature ink */
  --accent-soft: #dde5f7;
  --ok: #2e7d4f;
  --ok-soft: #dcefe3;
  --warn: #9a6210;
  --warn-soft: #f6e9cf;
  --crit: #b23a3a;
  --crit-soft: #f6dddd;
  --code-bg: #f1f3f7;
  --add-bg: #e1f1e6;
  --del-bg: #f7e1e1;
  --shadow: 0 1px 2px rgba(23, 32, 43, .06), 0 8px 24px rgba(23, 32, 43, .06);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --panel: #171e27; --raised: #1d2530; --ink: #e3e8ef; --muted: #95a1b3; --line: #2a3442;
    --accent: #93acf2; --accent-soft: #24324f; --ok: #62bf89; --ok-soft: #1b3326; --warn: #e2ab4f; --warn-soft: #3a2d15;
    --crit: #ef8080; --crit-soft: #3d2020; --code-bg: #141a22; --add-bg: #17301f; --del-bg: #351c1c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --panel: #171e27; --raised: #1d2530; --ink: #e3e8ef; --muted: #95a1b3; --line: #2a3442;
  --accent: #93acf2; --accent-soft: #24324f; --ok: #62bf89; --ok-soft: #1b3326; --warn: #e2ab4f; --warn-soft: #3a2d15;
  --crit: #ef8080; --crit-soft: #3d2020; --code-bg: #141a22; --add-bg: #17301f; --del-bg: #351c1c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 24px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: .86em; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 14px 12px; border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--display); font-size: 1.25rem; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: .9rem; }
.where { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: .78rem; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--panel); white-space: nowrap; }
.tag b { color: var(--ink); font-weight: 700; }
.keys { margin-left: auto; color: var(--muted); font-size: .8rem; display: flex; gap: 12px; flex-wrap: wrap; }
kbd { font-family: var(--mono); font-size: .75rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--raised); color: var(--ink); }

/* Lane tabs (narrow screens) */
.tabs { display: none; gap: 6px; padding-block: 12px 0; }
.tabs button { flex: 1; padding: 8px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; font-weight: 700; font-size: .9rem; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }

/* Lanes */
.lanes { display: grid; grid-template-columns: minmax(230px, 1fr) minmax(0, 2.4fr) minmax(250px, 1.1fr); gap: 18px; padding-top: 18px; align-items: start; }
.lane { min-width: 0; }
.lane-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 10px; }
.lane-head h2 { font-family: var(--display); font-size: .82rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin: 0; color: var(--muted); }
.lane-head .count { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.lane-scroll { display: grid; gap: 8px; }

/* Queue rows (Ahead) */
.thread { display: grid; gap: 6px; }
.thread + .thread { margin-top: 10px; }
.thread-name { font-size: .78rem; color: var(--muted); display: flex; gap: 6px; align-items: center; padding-left: 2px; }
.thread-name::before { content: ""; width: 10px; height: 1px; background: var(--line); }
.row {
  position: relative; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; text-align: left; width: 100%;
  padding: 10px 12px 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
}
.row:hover { border-color: var(--muted); }
.row[aria-current="true"] { border-color: var(--accent); background: var(--raised); box-shadow: var(--shadow); }
.row .stripe { position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; }
.risk-high .stripe { background: var(--crit); }
.risk-medium .stripe { background: var(--warn); }
.risk-low .stripe { background: var(--ok); }
.row .pick { grid-row: span 2; margin-top: 2px; }
.row .pick input { width: 16px; height: 16px; accent-color: var(--accent); }
.row .pick.empty { width: 16px; }
.row .kind { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row .ttl { font-weight: 700; font-size: .92rem; line-height: 1.3; overflow-wrap: anywhere; }
.row .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.next-mark { color: var(--accent); font-weight: 700; }
.row-open { all: unset; cursor: pointer; display: grid; gap: 3px; min-width: 0; }
.row-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; line-height: 1.6; padding: 0 7px; border-radius: 999px; white-space: nowrap; }
.chip.block { background: var(--crit-soft); color: var(--crit); font-weight: 700; }
.chip.dep { background: var(--warn-soft); color: var(--warn); }
.chip.exp { background: var(--code-bg); color: var(--muted); }
.chip.sig { background: var(--accent-soft); color: var(--accent); }
.chip.pol { background: var(--ok-soft); color: var(--ok); }

.batchbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--accent); }
.batchbar p { margin: 0; font-size: .85rem; }

/* Now panel */
.now { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.now-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; position: relative; }
.now-head .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.now-kicker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .78rem; color: var(--muted); }
.now-kicker .kind { text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--ink); }
.now-head h3 { font-family: var(--display); font-weight: 700; font-size: 1.45rem; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -.01em; overflow-wrap: anywhere; }
.subject { font-family: var(--mono); font-size: .84rem; color: var(--muted); overflow-wrap: anywhere; }
.peek { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 22px; background: var(--warn-soft); color: var(--ink); font-size: .85rem; border-bottom: 1px solid var(--line); }
.readonly { background: var(--code-bg); }
.now-body { padding: 16px 22px 8px; display: grid; gap: 18px; }
.sect h4 { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.sect h4 small { text-transform: none; letter-spacing: 0; font-size: .78rem; font-weight: 400; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: .9rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.codebox { margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); overflow-x: auto; }
.codebox .cap { font-family: var(--mono); font-size: .74rem; color: var(--muted); padding: 6px 12px; border-bottom: 1px solid var(--line); }
.codebox pre { margin: 0; padding: 8px 0; font-family: var(--mono); font-size: .8rem; line-height: 1.55; }
.codebox .ln { display: block; padding: 0 12px; white-space: pre; }
.codebox .ln.add { background: var(--add-bg); }
.codebox .ln.del { background: var(--del-bg); }
.codebox .ln.flag { box-shadow: inset 3px 0 0 var(--warn); }
.claim { margin: 0; padding: 10px 14px; border-left: 3px solid var(--line); color: var(--ink); font-style: italic; background: var(--panel); border-radius: 0 6px 6px 0; }
.advisor { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 14px; background: var(--panel); }
.advisor p { margin: 0; }
.advisor .who { font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
.advisor.loading p { color: var(--muted); }
.dots::after { content: "…"; animation: blink 1s steps(3) infinite; }
@keyframes blink { 50% { opacity: .3; } }

.decide { position: sticky; bottom: 0; border-top: 1px solid var(--line); background: var(--raised); padding: 14px 22px 16px; display: grid; gap: 10px; }
.decide label { font-size: .78rem; color: var(--muted); }
.decide textarea { width: 100%; min-height: 40px; resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; font-size: .88rem; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--raised); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); border-color: var(--crit); background: transparent; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn .key { font-family: var(--mono); font-size: .72rem; opacity: .8; }
.blocked-note { font-size: .85rem; color: var(--warn); }

/* Behind */
.hist { display: grid; gap: 6px; }
.hrow { text-align: left; width: 100%; border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; background: transparent; display: grid; gap: 2px; }
.hrow:hover { background: var(--panel); border-color: var(--line); }
.hrow[aria-current="true"] { background: var(--raised); border-color: var(--accent); }
.hrow .when { font-family: var(--mono); font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.hrow .what { font-size: .88rem; line-height: 1.35; overflow-wrap: anywhere; }
.hrow .what b { font-weight: 700; }
.hrow .by { display: flex; gap: 6px; flex-wrap: wrap; }
.hrow.superseded .what { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
.v-approved { color: var(--ok); }
.v-rejected { color: var(--crit); }
.v-neutral { color: var(--accent); }

/* Empty state */
.empty { padding: 40px 22px; text-align: center; color: var(--muted); }
.empty h3 { font-family: var(--display); color: var(--ink); margin: 0 0 6px; }

/* Passkey sheet */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .45); display: grid; place-items: center; z-index: 20; padding: 16px; }
.sheet { width: min(440px, 100%); background: var(--raised); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 22px; display: grid; gap: 14px; }
.sheet h3 { font-family: var(--display); margin: 0; font-size: 1.2rem; }
.sheet p { margin: 0; color: var(--muted); font-size: .9rem; }
.sheet ul { margin: 0; padding: 10px 12px; list-style: none; background: var(--code-bg); border-radius: 8px; display: grid; gap: 4px; max-height: 180px; overflow: auto; }
.sheet li { font-family: var(--mono); font-size: .76rem; overflow-wrap: anywhere; }
.touch { justify-self: center; width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--accent); background: var(--accent-soft); display: grid; place-items: center; }
.touch svg { width: 44px; height: 44px; stroke: var(--accent); fill: none; stroke-width: 1.6; stroke-linecap: round; }
.touch.signing { animation: pulse .7s ease-in-out infinite; }
.touch.done { background: var(--ok-soft); border-color: var(--ok); }
.touch.done svg { stroke: var(--ok); }
@keyframes pulse { 50% { transform: scale(1.06); } }
.sheet .row-btns { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

/* Toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: .9rem; z-index: 30; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

/* Compact view: one column sized for a window docked at the side of the screen */
#compact { max-width: 440px; margin: 14px auto 0; }
.c-panel { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); font-size: 13px; line-height: 1.4; overflow: hidden; }
.c-hint { color: var(--muted); font-size: 12px; text-align: center; margin: 8px 0 0; }
.c-top { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--raised); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; }
.c-top h1 { font-family: var(--display); font-size: 15px; font-weight: 700; margin: 0; }
.c-counts { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.c-spacer { margin-left: auto; }
.c-top .tag { font-size: 11px; padding: 0 6px; }
.c-btn { padding: 3px 9px; font-size: 12px; font-weight: 700; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); display: inline-flex; align-items: center; gap: 4px; }
.c-btn:hover { border-color: var(--muted); }
.c-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--raised); }
.c-btn.danger { color: var(--crit); border-color: var(--crit); background: transparent; }
.c-btn[disabled] { opacity: .45; cursor: not-allowed; }
.c-link { all: unset; cursor: pointer; color: var(--accent); font-size: 12px; font-weight: 700; }
.c-link:focus-visible, .c-open:focus-visible, .c-hrow:focus-visible, .c-bhead:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.lock { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.c-thread { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; padding: 8px 10px 2px; }
.c-row { display: grid; grid-template-columns: 16px 8px 30px minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 3px 10px; min-height: 30px; }
.c-row:hover { background: var(--panel); }
.c-row.cur { background: var(--accent-soft); }
.c-row input { width: 13px; height: 13px; margin: 0; accent-color: var(--accent); }
.c-dot { width: 8px; height: 8px; border-radius: 50%; }
.c-dot.high { background: var(--crit); } .c-dot.medium { background: var(--warn); } .c-dot.low { background: var(--ok); }
.c-kind { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: .03em; }
.c-open { all: unset; cursor: pointer; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.c-row.cur .c-open { font-weight: 700; }
.c-flags { display: flex; gap: 4px; }
.c-flag { font-size: 10px; line-height: 1.6; padding: 0 5px; border-radius: 999px; white-space: nowrap; }
.c-flag.block { background: var(--crit-soft); color: var(--crit); font-weight: 700; }
.c-flag.dep { background: var(--warn-soft); color: var(--warn); }
.c-flag.next { color: var(--accent); font-weight: 700; padding: 0; }
.c-row { transition: background-color .2s ease; }
.c-detail { display: grid; grid-template-rows: 1fr; background: var(--accent-soft); border-bottom: 1px solid var(--line); }
.c-clip { min-height: 0; }
.c-inner { display: grid; gap: 7px; padding: 6px 10px 10px 40px; }
.c-detail.grow { animation: c-open .28s cubic-bezier(.2, .7, .2, 1); }
.c-detail.grow > .c-clip { overflow: hidden; animation: c-fade .28s ease-out; }
@keyframes c-open { from { grid-template-rows: 0fr; } to { grid-template-rows: 1fr; } }
@keyframes c-fade { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.c-adv { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.c-adv.said { display: block; }
.c-btn kbd { font-size: 10px; padding: 0 4px; }
.c-btn svg.bubble { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.c-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-lab { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; margin-right: 4px; }
.c-facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 1px 10px; margin: 0; font-size: 12px; }
.c-facts dt { color: var(--muted); }
.c-facts dd { margin: 0; overflow-wrap: anywhere; }
.c-detail .codebox { margin-top: 0; background: var(--raised); }
.c-detail .codebox pre { font-size: 11px; padding: 4px 0; }
.c-detail .codebox .ln { padding: 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
.c-claim { font-style: italic; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.c-claim .c-lab { font-style: normal; }
.c-adv { font-size: 12px; }
.c-note { width: 100%; padding: 4px 8px; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised); }
.c-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.c-detail .blocked-note { font-size: 12px; margin: 0; }
.c-batch { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; background: var(--accent-soft); border-top: 1px solid var(--accent); position: sticky; bottom: 0; font-size: 12px; }
.c-empty { padding: 18px 10px; color: var(--muted); margin: 0; text-align: center; }
.c-behind { border-top: 1px solid var(--line); }
.c-bhead { all: unset; cursor: pointer; display: flex; justify-content: space-between; width: calc(100% - 20px); padding: 7px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
.c-hrow { all: unset; cursor: pointer; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 6px; align-items: center; width: calc(100% - 20px); padding: 3px 10px; min-height: 26px; }
.c-hrow:hover { background: var(--panel); }
.c-hrow.cur { background: var(--accent-soft); }
.c-hrow .t { font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.c-hrow .w { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-hrow.superseded .w { text-decoration: line-through; color: var(--muted); }

/* Narrow */
@media (max-width: 1080px) {
  .tabs { display: flex; }
  .lanes { grid-template-columns: minmax(0, 1fr); }
  .lane { display: none; }
  .lane.on { display: block; }
  .keys { display: none; }
}
@media (max-width: 520px) {
  .now-head, .now-body, .decide { padding-left: 14px; padding-right: 14px; }
  .facts { grid-template-columns: 1fr; gap: 0 0; }
  .facts dd { margin-bottom: 8px; }
  .now-head h3 { font-size: 1.2rem; }
}
@media (prefers-reduced-motion: reduce) {

        </section>
        <section class="sect">
          <h4>Requester's claim <small>${esc(it.requester)}</small></h4>
          <p class="claim">${esc(it.claim)}</p>
        </section>
        <section class="sect">
          <h4>Advisor <small>a different agent; evidence to weigh, not a verdict</small></h4>
          ${adv === "done" ? `<div class="advisor"><div class="who">advisor@desktop · read the facts and claim only</div><p>${esc(it.advisor)}</p></div>`
            : adv === "loading" ? `<div class="advisor loading"><p class="dots">Reading the item</p></div>`
            : `<button class="btn" data-advisor>Ask the advisor <span class="key">a</span></button>`}
        </section>
      </div>
      <div class="decide">
        ${dep ? `<p class="blocked-note">Decide <b>${esc(dep.title)}</b> first. This item depends on it.</p>` : ""}
        <label for="note">Note (optional, kept in history)</label>
        <textarea id="note" placeholder="Why you decided this way"></textarea>
        <div class="actions">
          ${it.actions.map((a) => `<button class="btn ${a.style}" data-act="${a.id}" ${dep ? "disabled" : ""}>${esc(a.label)}${a.sign ? " · passkey" : ""}</button>`).join("")}
        </div>
      </div>`;
  }

  function renderHistoryItem(root, h) {
    $("#now-pos").textContent = "history";
    root.innerHTML = `
      <div class="peek readonly"><span>Looking back. History is append-only: reconsidering adds a new decision on top.</span><button class="btn ghost" data-back>Back to next <span class="key">b</span></button></div>
      <div class="now-head">
        <div class="now-kicker"><span class="kind">${KIND[h.kind]}</span><span>${esc(h.when)}</span>${h.by === "policy" ? '<span class="chip pol">decided by policy</span>' : '<span class="chip sig">decided by you</span>'}</div>
        <h3><span class="v-${h.verdict}">${esc(h.text)}</span> ${esc(h.title)}</h3>
        <div class="subject">${esc(h.subject)}</div>
      </div>
      <div class="now-body">
        <section class="sect"><h4>Record</h4>${factsHTML(h.facts.concat(h.note && !h.facts.some((f) => f[0] === "Your note") ? [["Your note", h.note]] : []))}</section>
        ${h.superseded ? `<section class="sect"><h4>Since then</h4><p>${esc(h.superseded)}.</p></section>` : ""}
      </div>
      ${h.reconsider && !h.superseded ? `<div class="decide"><div class="actions">${h.reconsider.map((r, i) => `<button class="btn ${r.effect === "revert" ? "" : "danger"}" data-recon="${i}">${esc(r.label)}${r.sign ? " · passkey" : ""}</button>`).join("")}</div></div>` : ""}`;
  }

  function render() {
    $("#full").hidden = state.density === "compact";
    $("#compact").hidden = state.density !== "compact";
    if (state.density === "compact") return renderCompact();
    renderAhead(); renderBehind(); renderNow();
    for (const b of document.querySelectorAll(".tabs button")) {
      b.setAttribute("aria-selected", String(b.dataset.lane === state.lane));
      if (b.dataset.lane === "ahead") b.textContent = `Ahead · ${ahead.length}`;
      if (b.dataset.lane === "behind") b.textContent = `Behind · ${history.length}`;
    }
    for (const l of ["behind", "now", "ahead"]) $("#lane-" + l).classList.toggle("on", l === state.lane);
  }

  function compactDetail(it) {
    const dep = blockedBy(it);
    const adv = state.advisor[it.id];
    const allFacts = state.more.facts.has(it.id);
    const rows = allFacts ? it.facts : it.facts.slice(0, 3);
    const hiddenFacts = it.facts.length - rows.length;
    const flagged = it.code ? it.code.lines.filter(([c]) => c.includes("flag")).length : 0;
    const what = it.kind === "changeset" ? "diff" : "source";
    const showCode = state.more.diff.has(it.id);
    const noteOpen = state.more.note.has(it.id);
    return `
      <div class="c-detail ${growNow ? "grow" : ""}"><div class="c-clip"><div class="c-inner">
        <div class="c-sub" title="${esc(it.subject)}">${esc(it.subject)}</div>
        <div><span class="c-lab">Facts</span><span class="c-counts">from the broker · ${esc(it.risk)} risk${it.expires !== "none" ? ` · expires ${esc(it.expires)}` : ""}</span></div>
        <dl class="c-facts">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
        ${hiddenFacts ? `<button class="c-link" data-more="facts">${hiddenFacts} more facts</button>` : allFacts && it.facts.length > 3 ? `<button class="c-link" data-more="facts">Fewer facts</button>` : ""}
        ${it.code ? (showCode ? codeHTML(it.code) + `<button class="c-link" data-more="diff">Hide ${what}</button>`
          : `<button class="c-link" data-more="diff">Show ${what} · ${it.code.lines.length} lines${flagged ? ` · <span class="v-rejected">${flagged} flagged</span>` : ""}</button>`) : ""}
        <div class="c-claim" title="${esc(it.claim)}"><span class="c-lab">Claim</span>${esc(it.claim)}</div>
        <div class="c-adv ${adv === "done" ? "said" : ""}">${adv === "done" ? `<span class="c-lab">Advisor</span>${esc(it.advisor)}`
          : adv === "loading" ? `<span class="c-lab">Advisor</span><span class="dots">reading the item</span>`
          : `<span class="c-lab">Advisor</span><button class="c-btn" data-advisor title="A different agent reads the facts and claim and gives a second opinion">${BUBBLE}Ask the advisor <kbd>a</kbd></button>`}</div>
        ${dep ? `<p class="blocked-note">Decide "${esc(dep.title)}" first.</p>` : ""}
        ${noteOpen ? `<input id="c-note" class="c-note" placeholder="Note, kept in history" aria-label="Note, kept in history">` : ""}
        <div class="c-actions">
          ${it.actions.map((a) => `<button class="c-btn ${a.style}" data-act="${a.id}" ${dep ? "disabled" : ""} ${a.sign ? 'title="Signs with your passkey"' : ""}>${a.sign ? LOCK : ""}${esc(a.label)}</button>`).join("")}
          ${noteOpen ? "" : `<button class="c-link" data-more="note">Add note</button>`}
        </div>
      </div></div></div>`;
  }

  function compactHistory(h) {
    const cur = state.viewing === "history" && state.current === h.id;
    const row = `
      <button class="c-hrow ${cur ? "cur" : ""} ${h.superseded ? "superseded" : ""}" data-hist="${h.id}" title="${esc(h.text + " " + h.title)}">
        <span class="t" title="${esc(h.when)}">${esc(h.when.startsWith("Nov 5") ? "11-05" : h.when)}</span>
        <span class="w"><span class="v-${h.verdict}">${esc(h.text)}</span> ${esc(h.title)}</span>
        <span class="c-flags">${h.by === "policy" ? '<span class="c-flag dep" style="background:var(--ok-soft);color:var(--ok)">policy</span>' : ""}${h.sig ? `<span class="c-flag" style="color:var(--accent)" title="${esc(h.sig)}">${LOCK}</span>` : ""}</span>
      </button>`;
    if (!cur) return row;
    const facts = h.facts.concat(h.note && !h.facts.some((f) => f[0] === "Your note") ? [["Your note", h.note]] : []);
    return row + `
      <div class="c-detail ${growNow ? "grow" : ""}"><div class="c-clip"><div class="c-inner">
        <div class="c-sub">${esc(h.subject)}</div>
        <dl class="c-facts">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
        ${h.superseded ? `<div class="c-adv"><span class="c-lab">Since then</span>${esc(h.superseded)}</div>` : ""}
        ${h.reconsider && !h.superseded ? `<div class="c-actions">${h.reconsider.map((r, i) => `<button class="c-btn ${r.effect === "revert" ? "" : "danger"}" data-recon="${i}">${r.sign ? LOCK : ""}${esc(r.label)}</button>`).join("")}</div>` : ""}
      </div></div></div>`;
  }

  function renderCompact() {
    // Only an item that has just been opened plays the grow animation; re-renders of
    // an item already open (showing more facts, asking the advisor) leave it still.
    const openKey = state.viewing + ":" + state.current;
    growNow = openKey !== lastOpenKey;
    lastOpenKey = openKey;
    const blocking = ahead.filter((x) => x.blocking).length;
    const groups = [];
    for (const it of ahead) {
      let g = groups.find((x) => x.name === it.thread);
      if (!g) groups.push((g = { name: it.thread, items: [] }));
      g.items.push(it);
    }
    const rows = groups.map((g) => `<div class="c-thread">${esc(g.name)}</div>` + g.items.map((it) => {
      const cur = state.viewing === "ahead" && state.current === it.id;
      const dep = blockedBy(it);
      return `
        <div class="c-row ${cur ? "cur" : ""}">
          ${it.batch ? `<input type="checkbox" data-pick="${it.id}" ${state.selected.has(it.id) ? "checked" : ""} aria-label="Select ${esc(it.title)} for batch approval">` : "<span></span>"}
          <span class="c-dot ${it.risk}" title="${it.risk} risk"></span>
          <span class="c-kind" title="${KIND[it.kind]}">${ABBR[it.kind]}</span>
          <button class="c-open" data-open="${it.id}" title="${esc(it.title)}" ${cur ? 'aria-expanded="true"' : 'aria-expanded="false"'}>${esc(it.title)}</button>
          <span class="c-flags">
            ${it.id === ahead[0].id && !cur ? '<span class="c-flag next">next</span>' : ""}
            ${it.blocking ? '<span class="c-flag block">blocking</span>' : ""}
            ${dep ? `<span class="c-flag dep" title="After: ${esc(dep.title)}">after</span>` : ""}
          </span>
        </div>
        ${cur ? compactDetail(it) : ""}`;
    }).join("")).join("");
    const n = state.selected.size;
    $("#compact").innerHTML = `
      <div class="c-panel">
        <div class="c-top">
          <h1>Queue</h1>
          <span class="c-counts">${ahead.length} waiting${blocking ? ` · <span class="v-rejected">${blocking} blocking</span>` : ""}</span>
          <span class="c-spacer"></span>
          <span class="tag">work · desktop</span>
          <button class="c-btn" data-density="full" title="Full view (c)">Full view</button>
        </div>
        ${ahead.length ? rows : `<p class="c-empty">Nothing waiting. New requests appear here as agents make them.</p>`}
        ${n ? `<div class="c-batch"><span><b>${n} selected</b> · one passkey touch</span><span class="c-actions"><button class="c-link" data-batch="clear">Clear</button><button class="c-btn primary" data-batch="approve">${LOCK}Approve ${n}</button></span></div>` : ""}
        <div class="c-behind">
          <button class="c-bhead" data-behind aria-expanded="${state.behindOpen}"><span>Behind · ${history.length}</span><span>${state.behindOpen ? "hide" : "show"}</span></button>
          ${state.behindOpen ? history.map(compactHistory).join("") : ""}
        </div>
      </div>
      <p class="c-hint">Compact view, sized for a window docked at the side of the screen. Keys: n / p move, a asks the advisor, c switches view.</p>`;
  }

  // ---------------------------------------------------------------------------
  // Decisions
  // ---------------------------------------------------------------------------
  function toast(msg) {
    const el = document.createElement("div");
    el.className = "toast"; el.textContent = msg;
    $("#toast-root").replaceChildren(el);
    setTimeout(() => el.remove(), 2600);
  }

  function sign(lines, title, onDone) {
    const root = $("#sheet-root");
    root.innerHTML = `
      <div class="scrim" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet">
          <h3 id="sheet-title">${esc(title)}</h3>
          <p>Your passkey signs a hash of exactly this decision. The challenge covers:</p>
          <ul>${lines.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>
          <div class="touch" id="touch" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 0-7 7v3"/><path d="M19 13v-3a7 7 0 0 0-11-5.7"/><path d="M9 10a3 3 0 0 1 6 0v4a6 6 0 0 1-1 3.3"/><path d="M12 10v5a3 3 0 0 1-1 2.3"/><path d="M6 16.5A9 9 0 0 0 7.5 20"/></svg></div>
          <div class="row-btns">
            <button class="btn ghost" id="sheet-cancel">Cancel</button>
            <button class="btn primary" id="sheet-go">Touch to sign</button>
          </div>
        </div>
      </div>`;
    const onKey = (e) => { if (e.key === "Escape" && !$("#sheet-go").disabled) close(); };
    const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", onKey); };
    document.addEventListener("keydown", onKey);
    $("#sheet-cancel").onclick = close;
    $("#sheet-go").focus();
    $("#sheet-go").onclick = () => {
      const t = $("#touch"); t.classList.add("signing");
      $("#sheet-go").disabled = true; $("#sheet-cancel").disabled = true;
      setTimeout(() => { t.classList.remove("signing"); t.classList.add("done"); }, 650);
      setTimeout(() => { close(); onDone(`passkey · desktop Touch ID · ${fakeHash()}`); }, 1000);
    };
  }

  function commit(items, action, sig) {
    const noteEl = document.getElementById(state.density === "compact" ? "c-note" : "note");
    const note = (noteEl && noteEl.value.trim()) || "";
    tick();
    for (const it of items) {
      ahead = ahead.filter((x) => x !== it);
      state.selected.delete(it.id);
      history.unshift({
        id: "h" + (++seq + 100), when: hhmm(), verdict: action.verdict, text: action.past, title: it.title, by: "you", sig, note,
        kind: it.kind, subject: it.subject,
        facts: [["Decided", `2026-11-06 ${hhmm()} by you`]].concat(sig ? [["Signature", sig]] : []).concat(note ? [["Your note", note]] : []),
        reconsider: action.verdict === "approved" ? it.reconsider : undefined,
      });
    }
    state.viewing = "ahead";
    state.current = ahead[0] ? ahead[0].id : null;
    render();
    toast(items.length > 1 ? `${items.length} changesets approved and queued to apply` : `${action.past} ${items[0].title}`);
  }

  function decide(actId) {
    const it = byId(state.current);
    if (!it || blockedBy(it)) return;
    const action = it.actions.find((a) => a.id === actId);
    if (action.sign) {
      sign([`${it.id} · ${it.subject}`, `action: ${action.label}`, `nonce: ${fakeHash()}`], `${action.label}`, (sig) => commit([it], action, sig));
    } else commit([it], action);
  }

  function batchApprove() {
    const items = ahead.filter((x) => state.selected.has(x.id));
    if (!items.length) return;
    const action = { verdict: "approved", past: "Approved" };
    sign(items.map((x) => `${x.id} · ${x.subject}`).concat([`action: approve ${items.length} changesets`]), `Approve ${items.length} changesets`, (sig) => commit(items, action, sig));
  }

  function reconsider(i) {
    const h = histById(state.current);
    const r = h.reconsider[i];
    const run = (sig) => {
      tick();
      if (r.effect === "revert") {
        const item = {
          id: "q" + (++seq + 200), kind: "changeset", risk: "medium", thread: "Reconsidered", batch: true,
          title: `Revert: ${h.title}`, subject: `inverse of the changeset applied at ${h.when}`,
          requester: "you, from history", expires: "none",
          facts: [["Reverses", `${h.text} ${h.title} (${h.when})`], ["Precondition", "if_match the version the original change produced"], ["If it has changed since", "the revert comes back as a conflict, not an overwrite"]],
          claim: "You asked to undo this change from the history view.",
          advisor: "Reverting is a new changeset with its own precondition. The original stays in history.",
          actions: [{ id: "approve", label: "Approve", style: "primary", verdict: "approved", past: "Approved" }, { id: "reject", label: "Reject", style: "danger", verdict: "rejected", past: "Rejected" }],
        };
        ahead.unshift(item);
        h.superseded = `revert queued at ${hhmm()}`;
        state.viewing = "ahead"; state.current = item.id;
        render(); toast("Revert queued as a new changeset");
        return;
      }
      const verb = r.effect === "revoke" ? "Revoked" : "Demoted";
      history.unshift({
        id: "h" + (++seq + 100), when: hhmm(), verdict: "rejected", text: verb, title: h.title, by: "you", sig,
        kind: h.kind, subject: h.subject,
        facts: [["Decided", `2026-11-06 ${hhmm()} by you`], ["Supersedes", `${h.text} ${h.title} (${h.when})`], ["Signature", sig], ["Replicates", "as a signed revocation record to every instance in the persona"]],
      });
      h.superseded = `${verb.toLowerCase()} at ${hhmm()}`;
      state.current = history[0].id;
      render(); toast(`${verb} ${h.title}`);
    };
    if (r.sign) sign([`${h.id} · ${h.subject}`, `action: ${r.label}`, `nonce: ${fakeHash()}`], r.label, run);
    else run();
  }

  function askAdvisor() {
    const it = byId(state.current);
    if (!it || state.viewing !== "ahead" || state.advisor[it.id]) return;
    state.advisor[it.id] = "loading"; render();
    setTimeout(() => { state.advisor[it.id] = "done"; if (state.current === it.id) render(); }, 900);
  }

  function move(delta) {
    if (state.viewing !== "ahead") { state.viewing = "ahead"; state.current = ahead[0] && ahead[0].id; render(); return; }
    const i = ahead.findIndex((x) => x.id === state.current);
    const j = Math.max(0, Math.min(ahead.length - 1, i + delta));
    if (ahead[j]) { state.current = ahead[j].id; render(); }
  }

  // ---------------------------------------------------------------------------
  // Events
  // ---------------------------------------------------------------------------
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-open],[data-hist],[data-act],[data-back],[data-advisor],[data-batch],[data-recon],[data-density],[data-more],[data-behind],.tabs button");
    if (!t) return;
    if (t.dataset.open) { state.viewing = "ahead"; state.current = t.dataset.open; state.lane = "now"; render(); }
    else if (t.dataset.hist) { state.viewing = "history"; state.current = t.dataset.hist; state.lane = "now"; render(); }
    else if (t.dataset.act) decide(t.dataset.act);
    else if (t.hasAttribute("data-back")) { state.viewing = "ahead"; state.current = ahead[0] && ahead[0].id; render(); }
    else if (t.hasAttribute("data-advisor")) askAdvisor();
    else if (t.dataset.batch === "approve") batchApprove();
    else if (t.dataset.batch === "clear") { state.selected.clear(); render(); }
    else if (t.dataset.recon) reconsider(Number(t.dataset.recon));
    else if (t.dataset.lane) { state.lane = t.dataset.lane; render(); }
    else if (t.dataset.density) setDensity(t.dataset.density);
    else if (t.dataset.more) {
      const s = state.more[t.dataset.more];
      s.has(state.current) ? s.delete(state.current) : s.add(state.current);
      render();
      if (t.dataset.more === "note") { const n = document.getElementById("c-note"); if (n) n.focus(); }
    }
    else if (t.hasAttribute("data-behind")) { state.behindOpen = !state.behindOpen; render(); }
  });

  document.addEventListener("change", (e) => {
    const id = e.target.dataset && e.target.dataset.pick;
    if (!id) return;
    e.target.checked ? state.selected.add(id) : state.selected.delete(id);
    render();
  });

  document.addEventListener("keydown", (e) => {
    if (e.target.closest("textarea,input") || e.metaKey || e.ctrlKey || e.altKey || $("#sheet-root").children.length) return;
    if (e.key === "n") move(1);
    else if (e.key === "p") move(-1);
    else if (e.key === "a") askAdvisor();
    else if (e.key === "b") { state.viewing = "ahead"; state.current = ahead[0] && ahead[0].id; render(); }
    else if (e.key === "c") setDensity(state.density === "compact" ? "full" : "compact");
  });

  function setDensity(d) {
    state.density = d;
    try { localStorage.setItem("dq-density", d); } catch (e) { /* storage unavailable; the choice lasts this visit */ }
    render();
  }

  render();
})();
</script>
</body>
</html>
