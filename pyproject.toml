[project]
name = "maji-mcp"
version = "0.1.0"
description = "A self-hosted MCP service where agents write code against your services, in a sandbox"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "docker>=7.1",
    "httpx>=0.28",
    "httpx2>=2.5",
    "mcp>=2.3,<3",
    "starlette>=1.0",
    "webauthn>=3.0.1,<4",
]

[project.urls]
Repository = "https://github.com/scanner/maji-mcp"
Documentation = "https://github.com/scanner/maji-mcp/blob/main/docs/README.md"
Issues = "https://github.com/scanner/maji-mcp/issues"
Changelog = "https://github.com/scanner/maji-mcp/blob/main/CHANGELOG.md"

[project.scripts]
maji-broker = "maji_mcp.broker.server:main"
maji-runner = "maji_mcp.runner.server:main"
maji-gateway = "maji_mcp.gateway.server:main"
maji-bridge = "maji_mcp.host.bridge:main"
maji-control = "maji_mcp.control.server:main"
maji-setup = "maji_mcp.host.setup:main"
maji-relay = "maji_mcp.host.relay:main"
maji-library-use = "maji_mcp.broker.runlog:main"

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=40.54.0",
    "jsonschema>=4.23",
    "mypy>=1.14",
    "openapi-spec-validator>=0.7",
    "playwright==1.64.1",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-check>=3.0.3",
    "pytest-cov>=7.1.0",
    "pyyaml>=6",
    "referencing>=0.36",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maji_mcp"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "UP", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "docker: needs a Docker daemon and the runtime image (run with -m docker)",
    "local: needs local checkouts, such as emacs-org-mcp (run with -m local)",
    "browser: drives the built web client in your installed Chrome (make test-browser)",
]
addopts = "-m 'not docker and not local and not browser'"
